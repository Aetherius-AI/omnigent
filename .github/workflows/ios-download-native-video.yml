name: Temporary iOS download native video

on:
  push:
    branches: [test/ios-download-native-video-capture]

jobs:
  record:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: ".python-version"

      - uses: ./.github/actions/setup-pnpm

      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true

      - name: Install and build real Omnigent app
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: |
          uv sync --locked --extra all --group test
          pnpm install --frozen-lockfile --filter web
          pnpm --filter web run build

      - name: Select iPhone Simulator
        id: simulator
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | ruby -rjson -e '
            devices = JSON.parse(STDIN.read).fetch("devices").values.flatten
            phone = devices.find { |d| d["name"].start_with?("iPhone") && d["isAvailable"] }
            abort "No available iPhone Simulator" unless phone
            puts phone.fetch("udid")
          ')"
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Save fixed implementation
        run: |
          cp web/ios/Omnigent/OmnigentWebView.swift /tmp/OmnigentWebView.fixed.swift
          git show origin/main:web/ios/Omnigent/OmnigentWebView.swift \
            > web/ios/Omnigent/OmnigentWebView.swift

      - name: Build and record real File Viewer before fix
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.id }}
          OMNIGENT_IOS_DEVICE_ID: ${{ steps.simulator.outputs.id }}
          OMNIGENT_IOS_DERIVED_DATA: /tmp/before-derived
          OMNIGENT_IOS_TEST_METHOD: testNativeDownloadBeforeVideo
          OMNIGENT_E2E_HEALTH_TIMEOUT_S: "120"
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project web/ios/Omnigent.xcodeproj \
            -scheme Omnigent \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$OMNIGENT_IOS_DERIVED_DATA" \
            -only-testing:OmnigentUITests \
            CODE_SIGNING_ALLOWED=NO
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl io "$DEVICE_ID" recordVideo --codec=h264 /tmp/before.mp4 &
          VIDEO_PID=$!
          trap 'kill -INT "$VIDEO_PID" 2>/dev/null || true' EXIT
          uv run pytest tests/e2e_ui/mobile/test_ios_native_download_capture.py \
            --ui-skip-build -vv -s
          kill -INT "$VIDEO_PID"
          wait "$VIDEO_PID" || true
          trap - EXIT

      - name: Record after fix
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.id }}
          OMNIGENT_E2E_HEALTH_TIMEOUT_S: "120"
        run: |
          set -euo pipefail
          cp /tmp/OmnigentWebView.fixed.swift web/ios/Omnigent/OmnigentWebView.swift
          xcrun simctl uninstall "$DEVICE_ID" ai.omnigent.ios 2>/dev/null || true
          xcodebuild build-for-testing \
            -project web/ios/Omnigent.xcodeproj \
            -scheme Omnigent \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath /tmp/after-derived \
            -only-testing:OmnigentUITests \
            CODE_SIGNING_ALLOWED=NO
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl io "$DEVICE_ID" recordVideo --codec=h264 /tmp/after.mp4 &
          VIDEO_PID=$!
          trap 'kill -INT "$VIDEO_PID" 2>/dev/null || true' EXIT
          OMNIGENT_IOS_DEVICE_ID="$DEVICE_ID" \
          OMNIGENT_IOS_DERIVED_DATA=/tmp/after-derived \
          OMNIGENT_IOS_TEST_METHOD=testNativeDownloadAfterVideo \
            uv run pytest tests/e2e_ui/mobile/test_ios_native_download_capture.py \
              --ui-skip-build -vv -s
          kill -INT "$VIDEO_PID"
          wait "$VIDEO_PID" || true
          trap - EXIT

      - name: Upload native recordings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-download-native-before-after
          path: |
            /tmp/before.mp4
            /tmp/after.mp4
          if-no-files-found: warn
